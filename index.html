<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600;12..96,700&family=Inter:wght@400;500;600;650&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* ============================================================
   PLACEFLIX — design tokens
   ink   #0C1D2F  (logo navy)      signal #7ABA25 (logo green)
   ============================================================ */
:root{
  --ink:#0C1D2F; --ink-2:#16324B; --ink-3:#2C4A63;
  --signal:#7ABA25; --signal-d:#5F9418; --signal-soft:#EDF6E1;
  --paper:#F5F7F6; --card:#FFFFFF; --line:#E2E7E5; --line-2:#CFD7D4;
  --muted:#5D6E79; --danger:#C2412D; --amber:#B87A0B;
  --r:14px; --r-sm:9px;
  --shadow:0 1px 2px rgba(12,29,47,.05), 0 12px 28px -18px rgba(12,29,47,.35);
  --shadow-lg:0 2px 6px rgba(12,29,47,.06), 0 30px 60px -28px rgba(12,29,47,.42);
  --display:'Bricolage Grotesque','Inter',system-ui,sans-serif;
  --body:'Inter',system-ui,-apple-system,sans-serif;
  --mono:'IBM Plex Mono',ui-monospace,monospace;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{
  margin:0;background:var(--paper);color:var(--ink);font-family:var(--body);
  font-size:16px;line-height:1.55;-webkit-font-smoothing:antialiased;
}
img{max-width:100%;display:block}
button,input,select,textarea{font:inherit;color:inherit}
a{color:inherit}
:focus-visible{outline:2.5px solid var(--signal-d);outline-offset:2px;border-radius:4px}
.wrap{width:min(1180px,92vw);margin-inline:auto}
.eyebrow{
  font-family:var(--mono);font-size:11.5px;letter-spacing:.16em;text-transform:uppercase;
  color:var(--muted);margin:0 0 14px;
}
.hide{display:none !important}
.only-mobile{display:none}

/* ---------- buttons ---------- */
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:9px;
  padding:13px 22px;border-radius:999px;border:1.5px solid transparent;
  font-weight:600;font-size:15px;cursor:pointer;text-decoration:none;
  transition:transform .16s ease, background .16s ease, border-color .16s ease, color .16s ease;
  background:var(--ink);color:#fff;white-space:nowrap;
}
.btn:hover{transform:translateY(-1px)}
.btn:active{transform:translateY(0)}
.btn.primary{background:var(--signal);color:#0B2200;border-color:var(--signal)}
.btn.primary:hover{background:var(--signal-d);color:#fff;border-color:var(--signal-d)}
.btn.ghost{background:transparent;color:var(--ink);border-color:var(--line-2)}
.btn.ghost:hover{border-color:var(--ink);background:rgba(12,29,47,.04)}
.btn.on-dark{background:rgba(255,255,255,.1);color:#fff;border-color:rgba(255,255,255,.4)}
.btn.on-dark:hover{background:rgba(255,255,255,.18)}
.btn.sm{padding:8px 15px;font-size:13.5px}
.btn.wide{width:100%}
.btn:disabled{opacity:.45;cursor:not-allowed;transform:none}

/* ---------- top bar ---------- */
.topbar{
  position:fixed;inset:0 0 auto;z-index:60;padding:14px 0;
  transition:background .3s ease, box-shadow .3s ease, padding .3s ease;
}
.topbar.solid{background:rgba(255,255,255,.92);backdrop-filter:blur(14px);box-shadow:0 1px 0 var(--line);padding:9px 0}
.topbar .row{display:flex;align-items:center;gap:18px}
.topbar .brand{display:flex;align-items:center;gap:10px;text-decoration:none;margin-right:auto}
.topbar .brand img{height:34px;width:auto}
.navlinks{display:flex;align-items:center;gap:26px}
.navlinks a{
  text-decoration:none;font-size:14.5px;font-weight:500;color:var(--ink);opacity:.78;
  padding:4px 0;border-bottom:1.5px solid transparent;
}
.navlinks a:hover{opacity:1;border-bottom-color:var(--signal)}
.topbar.over-dark:not(.solid) .navlinks a{color:#fff}
.topbar.over-dark:not(.solid) .btn.ghost{color:#fff;border-color:rgba(255,255,255,.45)}
.topbar.over-dark:not(.solid) .btn.ghost:hover{background:rgba(255,255,255,.14);border-color:#fff}
.navlinks a.admin-link{
  font-family:var(--mono);font-size:12px;letter-spacing:.1em;text-transform:uppercase;
  border:1.5px solid var(--line-2);border-radius:999px;padding:6px 13px;opacity:.9;
}
.navlinks a.admin-link:hover{border-color:var(--ink);border-bottom-color:var(--ink);opacity:1}
.topbar.over-dark:not(.solid) .navlinks a.admin-link{border-color:rgba(255,255,255,.4)}
.menu-btn{display:none;background:none;border:1.5px solid var(--line-2);border-radius:10px;padding:8px 11px;cursor:pointer}

/* ============================================================
   HERO
   ============================================================ */
.hero{position:relative;min-height:100svh;display:grid;place-items:center;overflow:hidden;isolation:isolate;text-align:center}
.hero-bg{position:absolute;inset:0;z-index:-2;background-size:cover;background-position:center;background-repeat:no-repeat}
.hero-scrim{position:absolute;inset:0;z-index:-1}
.hero.theme-light .hero-scrim{background:linear-gradient(180deg,rgba(255,255,255,var(--scrim)) 0%,rgba(255,255,255,calc(var(--scrim) * .82)) 45%,rgba(245,247,246,.97) 100%)}
.hero.theme-dark .hero-scrim{background:linear-gradient(180deg,rgba(12,29,47,calc(var(--scrim) * .92)) 0%,rgba(12,29,47,var(--scrim)) 40%,rgba(12,29,47,.97) 100%)}
.hero-inner{padding:130px 0 132px;width:min(880px,92vw)}
.hero-logo{width:min(340px,72vw);margin:0 auto 34px;animation:rise .9s cubic-bezier(.16,1,.3,1) both}
.hero h1{
  font-family:var(--display);font-weight:700;letter-spacing:-.025em;line-height:1.04;
  font-size:clamp(1.95rem,4.7vw,3.5rem);margin:0 0 18px;max-width:20ch;margin-inline:auto;animation:rise .9s .08s cubic-bezier(.16,1,.3,1) both;
}
.hero h1 em{font-style:normal;color:var(--signal-d);position:relative;white-space:nowrap}
.hero.theme-dark h1 em{color:var(--signal)}
.hero p.lede{
  font-size:clamp(1rem,1.6vw,1.18rem);max-width:610px;margin:0 auto 34px;color:var(--muted);
  animation:rise .9s .16s cubic-bezier(.16,1,.3,1) both;
}
.hero.theme-dark{color:#fff}
.hero.theme-dark p.lede{color:rgba(255,255,255,.8)}
.hero-cta{display:flex;gap:13px;justify-content:center;flex-wrap:wrap;animation:rise .9s .24s cubic-bezier(.16,1,.3,1) both}
.hero-meta{
  margin-top:52px;display:flex;gap:34px;justify-content:center;flex-wrap:wrap;
  font-family:var(--mono);font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);
  animation:rise .9s .32s cubic-bezier(.16,1,.3,1) both;
}
.hero.theme-dark .hero-meta{color:rgba(255,255,255,.62)}
.hero-meta b{display:block;font-family:var(--display);font-size:27px;letter-spacing:-.02em;color:var(--ink);margin-bottom:1px}
.hero.theme-dark .hero-meta b{color:#fff}
.hero h1{
  font-family:var(--display);font-weight:700;letter-spacing:-.02em;line-height:1.14;
  font-size:clamp(1.3rem,2.7vw,2rem);margin:0 0 30px;max-width:24ch;margin-inline:auto;
  animation:rise .9s .08s cubic-bezier(.16,1,.3,1) both;
}
.hero h1 em{font-style:normal;color:var(--signal-d)}
.hero.theme-dark h1{color:#fff}
.hero.theme-dark h1 em{color:var(--signal)}
.ffoi-corner{
  position:absolute;right:max(4vw,18px);bottom:24px;z-index:3;
  display:flex;align-items:center;gap:11px;
  font-family:var(--mono);font-size:9.5px;letter-spacing:.15em;text-transform:uppercase;
  color:var(--muted);opacity:.92;
}
.ffoi-corner img{height:46px;width:auto;display:block}
.hero.theme-dark .ffoi-corner{color:rgba(255,255,255,.62)}
.foot .ffoi{margin-top:20px;padding-top:18px;border-top:1px solid rgba(255,255,255,.14)}
.foot .ffoi small{
  display:block;font-family:var(--mono);font-size:9.5px;letter-spacing:.15em;
  text-transform:uppercase;color:#8fa4bd;margin-bottom:9px;
}
.foot .ffoi img{height:52px;width:auto}
.scroll-cue{
  position:absolute;bottom:26px;left:50%;transform:translateX(-50%);
  font-family:var(--mono);font-size:10.5px;letter-spacing:.2em;text-transform:uppercase;color:var(--muted);
  display:flex;flex-direction:column;align-items:center;gap:7px;
}
.hero.theme-dark .scroll-cue{color:rgba(255,255,255,.6)}
.scroll-cue span{width:1px;height:34px;background:currentColor;opacity:.5;animation:cue 2.1s ease-in-out infinite}
@keyframes cue{0%,100%{transform:scaleY(.35);transform-origin:top}50%{transform:scaleY(1);transform-origin:top}}
@keyframes rise{from{opacity:0;transform:translateY(22px)}to{opacity:1;transform:none}}

/* ============================================================
   SECTIONS
   ============================================================ */
.section{padding:96px 0}
section[id]{scroll-margin-top:88px}
.section.tight{padding:70px 0}
.section-head{max-width:720px;margin-bottom:44px}
.section-head h2{
  font-family:var(--display);font-weight:700;letter-spacing:-.022em;line-height:1.08;
  font-size:clamp(1.85rem,3.6vw,2.85rem);margin:0 0 14px;
}
.section-head p{color:var(--muted);margin:0;font-size:17px;max-width:60ch}
.ink-band{background:var(--ink);color:#fff}
.ink-band .section-head p{color:rgba(255,255,255,.72)}
.ink-band .eyebrow{color:var(--signal)}

/* ---------- placement wall (signature) ---------- */
.wall{overflow:hidden;padding:6px 0;position:relative}
.wall::before,.wall::after{
  content:'';position:absolute;top:0;bottom:0;width:120px;z-index:3;pointer-events:none;
}
.wall::before{left:0;background:linear-gradient(90deg,var(--ink),transparent)}
.wall::after{right:0;background:linear-gradient(270deg,var(--ink),transparent)}
.wall-track{display:flex;gap:14px;width:max-content;animation:slide 78s linear infinite}
.wall-track.rev{animation-direction:reverse;animation-duration:92s}
.wall:hover .wall-track{animation-play-state:paused}
@keyframes slide{from{transform:translateX(0)}to{transform:translateX(-50%)}}
.chip{
  display:flex;align-items:center;gap:13px;padding:11px 20px 11px 11px;border-radius:999px;
  background:rgba(255,255,255,.055);border:1px solid rgba(255,255,255,.12);flex:0 0 auto;
}
.chip img.face{width:48px;height:48px;border-radius:50%;object-fit:cover;background:#fff}
.chip .who{display:flex;flex-direction:column;gap:3px;min-width:0}
.chip .nm{display:block;font-size:14px;font-weight:600;white-space:nowrap}
.chip .co{display:block;
  font-family:var(--mono);font-size:10.5px;letter-spacing:.09em;text-transform:uppercase;
  color:var(--signal);white-space:nowrap;
}
.wall-note{
  margin-top:34px;display:flex;gap:28px;flex-wrap:wrap;align-items:center;justify-content:center;
  font-family:var(--mono);font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:rgba(255,255,255,.5);
}

/* ---------- logo rail ---------- */
.rail{
  display:flex;flex-wrap:wrap;gap:14px;justify-content:center;align-items:center;
  margin-top:46px;padding-top:38px;border-top:1px solid rgba(255,255,255,.14);
}
.rail img{height:26px;width:auto;opacity:.9;filter:brightness(0) invert(1);transition:opacity .2s}
.rail .box{background:rgba(255,255,255,.94);border-radius:8px;padding:9px 14px;display:grid;place-items:center}
.rail .box img{filter:none;opacity:1;height:24px}

/* ---------- testimonials ---------- */
.tgrid{columns:3 300px;column-gap:22px}
.tcard{
  break-inside:avoid;margin-bottom:22px;background:var(--card);border:1px solid var(--line);
  border-radius:var(--r);padding:24px;box-shadow:var(--shadow);
  transition:transform .22s ease, box-shadow .22s ease;
}
.tcard:hover{transform:translateY(-3px);box-shadow:var(--shadow-lg)}
.tcard .mark{font-family:var(--display);font-size:40px;line-height:.7;color:var(--signal);margin-bottom:12px}
.tcard blockquote{margin:0 0 20px;font-size:15.5px;line-height:1.62}
.tcard .by{display:flex;align-items:center;flex-wrap:wrap;gap:12px;padding-top:17px;border-top:1px solid var(--line)}
.tcard .by img.face{width:44px;height:44px;border-radius:50%;object-fit:cover;flex:0 0 auto;background:var(--paper)}
.tcard .by > span:nth-child(2){flex:1;min-width:0}
.tcard .by .nm{font-weight:600;font-size:14.5px;display:block}
.tcard .by .sub{display:block;font-family:var(--mono);font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin-top:2px}
.tcard .by::after{content:'';flex-basis:100%;height:0;order:2}
.tcard .by .colo{order:3;margin:14px 0 0 auto;height:23px;width:auto;max-width:120px;object-fit:contain;opacity:.95}

/* ---------- steps ---------- */
.steps{display:grid;grid-template-columns:repeat(4,1fr);gap:20px}
.step{padding:26px 22px;border:1px solid var(--line);border-radius:var(--r);background:var(--card);position:relative}
.step .no{
  font-family:var(--mono);font-size:11px;letter-spacing:.14em;color:var(--signal-d);
  display:block;margin-bottom:14px;
}
.step h3{font-family:var(--display);font-size:19px;margin:0 0 9px;letter-spacing:-.01em}
.step p{margin:0;font-size:14.5px;color:var(--muted)}

/* ---------- CTA band ---------- */
.cta-band{
  background:var(--signal);color:#0A1F00;border-radius:26px;padding:56px 44px;text-align:center;
}
.cta-band h2{font-family:var(--display);font-size:clamp(1.7rem,3.4vw,2.5rem);margin:0 0 12px;letter-spacing:-.02em}
.cta-band p{margin:0 0 26px;font-size:16.5px;opacity:.82}

/* ---------- footer ---------- */
.foot{background:var(--ink);color:rgba(255,255,255,.62);padding:52px 0 34px;font-size:14px}
.foot .cols{display:flex;gap:40px;flex-wrap:wrap;align-items:flex-start;justify-content:space-between}
.foot img.logo{height:34px;margin-bottom:14px}
.foot a{color:rgba(255,255,255,.72);text-decoration:none}
.foot a:hover{color:var(--signal)}
.foot .base{
  margin-top:34px;padding-top:20px;border-top:1px solid rgba(255,255,255,.12);
  display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap;font-size:12.5px;
}

/* ============================================================
   APP PAGES (register / test / result / admin)
   ============================================================ */
.page{min-height:100svh;padding:104px 0 70px;background:var(--paper)}
.panel{
  background:var(--card);border:1px solid var(--line);border-radius:20px;
  padding:38px;box-shadow:var(--shadow);
}
.panel h1{font-family:var(--display);font-size:clamp(1.6rem,3vw,2.2rem);margin:0 0 10px;letter-spacing:-.02em}
.panel > p.sub{color:var(--muted);margin:0 0 28px}
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:18px}
.field{display:flex;flex-direction:column;gap:7px}
.field.full{grid-column:1/-1}
.field label{font-size:13.5px;font-weight:600}
.field label .req{color:var(--danger)}
.field input,.field select,.field textarea{
  padding:12px 14px;border:1.5px solid var(--line-2);border-radius:var(--r-sm);background:#fff;
  transition:border-color .16s, box-shadow .16s;font-size:15px;width:100%;
}
.field input:focus,.field select:focus,.field textarea:focus{
  outline:none;border-color:var(--signal-d);box-shadow:0 0 0 3px rgba(122,186,37,.18);
}
.field .err{color:var(--danger);font-size:12.5px;min-height:0}
.field.bad input,.field.bad select{border-color:var(--danger)}
.field .hint{font-size:12.5px;color:var(--muted)}
.note{
  background:var(--signal-soft);border:1px solid #CFE6AE;border-radius:var(--r-sm);
  padding:14px 16px;font-size:14px;display:flex;gap:11px;align-items:flex-start;
}
.note.warn{background:#FFF6E5;border-color:#F0DCB0}
.note.info{background:#EEF3F7;border-color:#D7E2EA}
.note b{font-weight:650}

/* ---------- test ---------- */
.test-bar{
  position:fixed;top:0;left:0;right:0;z-index:70;background:var(--ink);color:#fff;
  padding:11px 0;box-shadow:0 6px 24px -14px rgba(0,0,0,.6);
}
.test-bar .row{display:flex;align-items:center;gap:18px;flex-wrap:wrap}
.test-bar img{height:24px}
.test-bar .who{font-size:13px;color:rgba(255,255,255,.7);margin-right:auto;font-family:var(--mono);letter-spacing:.05em}
.timer{
  font-family:var(--mono);font-size:19px;font-weight:600;letter-spacing:.06em;
  background:rgba(255,255,255,.1);padding:5px 14px;border-radius:9px;border:1px solid rgba(255,255,255,.18);
}
.timer.low{background:rgba(194,65,45,.24);border-color:#E08573;animation:pulse 1.1s ease-in-out infinite}
@keyframes pulse{50%{opacity:.55}}
.test-grid{display:grid;grid-template-columns:1fr 258px;gap:26px;align-items:start}
.qcard{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:32px;box-shadow:var(--shadow)}
.qmeta{display:flex;gap:12px;align-items:center;margin-bottom:18px;flex-wrap:wrap}
.tag{
  font-family:var(--mono);font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;
  background:var(--signal-soft);color:var(--signal-d);padding:4px 10px;border-radius:999px;border:1px solid #D5E9B8;
}
.tag.grey{background:#EEF2F1;color:var(--muted);border-color:var(--line)}
.qtext{font-size:19px;font-weight:600;line-height:1.45;margin:0 0 24px;letter-spacing:-.01em}
.opts{display:flex;flex-direction:column;gap:11px}
.opt{
  display:flex;gap:13px;align-items:flex-start;padding:15px 17px;border:1.5px solid var(--line-2);
  border-radius:12px;cursor:pointer;background:#fff;transition:border-color .15s, background .15s;
}
.opt:hover{border-color:var(--ink-3);background:#FBFCFB}
.opt input{margin:0;accent-color:var(--signal-d);width:19px;height:19px;flex:0 0 auto;margin-top:1px}
.opt.sel{border-color:var(--signal-d);background:var(--signal-soft)}
.opt .k{font-family:var(--mono);font-size:13px;color:var(--muted);flex:0 0 auto}
.test-side{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:22px;position:sticky;top:80px}
.palette{display:grid;grid-template-columns:repeat(5,1fr);gap:9px;margin:14px 0 18px}
.pal{
  aspect-ratio:1;border-radius:9px;border:1.5px solid var(--line-2);background:#fff;cursor:pointer;
  font-family:var(--mono);font-size:13px;font-weight:600;display:grid;place-items:center;transition:all .14s;
}
.pal:hover{border-color:var(--ink)}
.pal.done{background:var(--signal);border-color:var(--signal);color:#0B2200}
.pal.now{outline:2.5px solid var(--ink);outline-offset:1.5px}
.legend{display:flex;flex-direction:column;gap:7px;font-size:12.5px;color:var(--muted);margin-bottom:18px}
.legend i{width:12px;height:12px;border-radius:4px;display:inline-block;margin-right:8px;vertical-align:-1px;border:1.5px solid var(--line-2)}
.legend i.d{background:var(--signal);border-color:var(--signal)}
.nav-row{display:flex;gap:11px;margin-top:26px;flex-wrap:wrap}

/* ---------- result ---------- */
.score-hero{display:flex;gap:34px;align-items:center;flex-wrap:wrap}
.dial{
  --p:0;width:168px;height:168px;border-radius:50%;flex:0 0 auto;display:grid;place-items:center;
  background:conic-gradient(var(--signal) calc(var(--p) * 1%), var(--line) 0);
}
.dial .in{width:132px;height:132px;border-radius:50%;background:var(--card);display:grid;place-items:center;text-align:center}
.dial .pc{font-family:var(--display);font-size:38px;font-weight:700;letter-spacing:-.03em;line-height:1}
.dial .lb{font-family:var(--mono);font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);margin-top:5px}
.verdict{
  display:inline-flex;align-items:center;gap:9px;padding:8px 16px;border-radius:999px;font-weight:650;font-size:14px;
}
.verdict.pass{background:var(--signal-soft);color:var(--signal-d);border:1px solid #CFE6AE}
.verdict.fail{background:#FDF0ED;color:var(--danger);border:1px solid #F2CDC5}
.breakdown{display:grid;gap:14px;margin-top:8px}
.bd-row{display:grid;grid-template-columns:130px 1fr 56px;gap:14px;align-items:center;font-size:14px}
.bar{height:9px;background:var(--line);border-radius:99px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--signal);border-radius:99px;transition:width .8s cubic-bezier(.16,1,.3,1)}
.bd-row .v{font-family:var(--mono);font-size:13px;text-align:right;color:var(--muted)}

/* ---------- admin ---------- */
.admin-shell{padding-top:88px}
.tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:26px;border-bottom:1px solid var(--line);padding-bottom:0}
.tab{
  background:none;border:none;border-bottom:2.5px solid transparent;padding:11px 4px;margin-right:20px;
  cursor:pointer;font-weight:600;font-size:15px;color:var(--muted);
}
.tab.on{color:var(--ink);border-bottom-color:var(--signal)}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(158px,1fr));gap:14px;margin-bottom:24px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:18px 20px}
.stat .k{font-family:var(--mono);font-size:10.5px;letter-spacing:.13em;text-transform:uppercase;color:var(--muted)}
.stat .v{font-family:var(--display);font-size:31px;font-weight:700;letter-spacing:-.03em;margin-top:6px;line-height:1}
.stat.hot .v{color:var(--amber)}
.toolbar{display:flex;gap:11px;flex-wrap:wrap;align-items:center;margin-bottom:16px}
.toolbar input[type=search]{
  padding:10px 14px;border:1.5px solid var(--line-2);border-radius:999px;min-width:230px;background:#fff;
}
.chipset{display:flex;gap:7px;flex-wrap:wrap}
.fchip{
  padding:7px 14px;border-radius:999px;border:1.5px solid var(--line-2);background:#fff;cursor:pointer;
  font-size:13.5px;font-weight:500;
}
.fchip.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.table-wrap{background:var(--card);border:1px solid var(--line);border-radius:var(--r);overflow:auto}
table{border-collapse:collapse;width:100%;min-width:1080px;font-size:14px}
th{
  text-align:left;padding:13px 14px;background:#F1F4F3;border-bottom:1px solid var(--line);
  font-family:var(--mono);font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);
  position:sticky;top:0;z-index:2;white-space:nowrap;
}
td{padding:13px 14px;border-bottom:1px solid var(--line);vertical-align:middle}
tbody tr:hover{background:#FAFBFA}
tbody tr:last-child td{border-bottom:none}
.pill{
  display:inline-block;padding:4px 11px;border-radius:999px;font-size:11.5px;font-weight:650;white-space:nowrap;
  font-family:var(--mono);letter-spacing:.05em;text-transform:uppercase;
}
.pill.wait{background:#FFF4DE;color:#8A5B00}
.pill.live{background:var(--signal-soft);color:var(--signal-d)}
.pill.none{background:#EEF2F1;color:var(--muted)}
.detail td{background:#FAFBFA;padding:0}
.detail .inner{padding:22px 20px;display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:20px}
.kv{font-size:13.5px}
.kv .k{font-family:var(--mono);font-size:10px;letter-spacing:.11em;text-transform:uppercase;color:var(--muted);display:block;margin-bottom:3px}
.answers{grid-column:1/-1;display:flex;flex-wrap:wrap;gap:7px}
.ans{
  font-family:var(--mono);font-size:11.5px;padding:5px 9px;border-radius:7px;border:1px solid var(--line-2);background:#fff;
}
.ans.ok{background:var(--signal-soft);border-color:#CFE6AE;color:var(--signal-d)}
.ans.no{background:#FDF0ED;border-color:#F2CDC5;color:var(--danger)}
.empty{padding:56px 24px;text-align:center;color:var(--muted)}
.empty h3{font-family:var(--display);color:var(--ink);margin:0 0 8px;font-size:20px}

/* gallery */
.gallery{display:grid;grid-template-columns:repeat(auto-fill,minmax(215px,1fr));gap:16px}
.gcard{
  border:2px solid var(--line);border-radius:var(--r);overflow:hidden;cursor:pointer;background:#fff;
  transition:border-color .16s, transform .16s;text-align:left;padding:0;
}
.gcard:hover{transform:translateY(-2px)}
.gcard.on{border-color:var(--signal);box-shadow:0 0 0 3px rgba(122,186,37,.2)}
.gcard .thumb{display:block;height:112px;background-size:cover;background-position:center}
.gcard .lbl{padding:10px 13px;font-size:13.5px;font-weight:600;display:flex;justify-content:space-between;align-items:center;gap:8px}
.gcard .lbl small{font-family:var(--mono);font-size:9.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);font-weight:500}
.range{width:100%;accent-color:var(--signal-d)}
.preview-hero{
  border-radius:var(--r);overflow:hidden;border:1px solid var(--line);min-height:210px;
  display:grid;place-items:center;text-align:center;padding:34px 20px;background-size:cover;background-position:center;position:relative;
}
.preview-hero .pv-in{position:relative;z-index:2}
.preview-hero .pv-scrim{position:absolute;inset:0;z-index:1}
.preview-hero img{width:190px;margin:0 auto 12px}
.pv-in em{font-style:normal;color:var(--signal-d)}
.pv-in.dark em{color:var(--signal)}
.preview-hero h4{font-family:var(--display);font-size:22px;margin:0 0 6px;letter-spacing:-.02em}
.preview-hero p{margin:0;font-size:13.5px;opacity:.8}

/* login */
.login-wrap{display:grid;place-items:center;min-height:100svh;padding:100px 0 60px}
.login-card{width:min(420px,92vw);background:var(--card);border:1px solid var(--line);border-radius:20px;padding:34px;box-shadow:var(--shadow-lg)}
.login-card img{height:36px;margin:0 auto 22px;display:block}

/* registration sheet */
.sheet-host{
  position:fixed;inset:0;z-index:160;background:rgba(12,29,47,.62);backdrop-filter:blur(5px);
  overflow:auto;padding:26px 20px;display:flex;align-items:flex-start;justify-content:center;
  animation:fade .22s ease;
}
.sheet{width:min(780px,100%);margin:auto;animation:sheetIn .34s cubic-bezier(.16,1,.3,1)}
.sheet .panel{position:relative;border-radius:22px}
.sheet-close{
  position:absolute;top:16px;right:16px;width:36px;height:36px;border-radius:50%;
  border:1.5px solid var(--line-2);background:#fff;cursor:pointer;font-size:15px;line-height:1;
  color:var(--muted);display:grid;place-items:center;
}
.sheet-close:hover{border-color:var(--ink);color:var(--ink)}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes sheetIn{from{opacity:0;transform:translateY(26px) scale(.985)}to{opacity:1;transform:none}}
@media (max-width:760px){
  .sheet-host{padding:14px 12px}
  .sheet .panel{padding:24px 18px}
  .sheet-close{top:10px;right:10px}
}

/* test-details step */
.detail-grid{display:flex;flex-wrap:wrap;gap:10px;margin:6px 0 26px}
.detail-grid div{flex:1 1 116px;background:var(--paper);border:1px solid var(--line);border-radius:var(--r-sm);padding:14px 16px}
.detail-grid .k{font-family:var(--mono);font-size:10px;letter-spacing:.13em;text-transform:uppercase;color:var(--muted);display:block;margin-bottom:6px}
.detail-grid .v{font-family:var(--display);font-size:21px;font-weight:600;letter-spacing:-.02em;line-height:1.15}
.detail-grid .v small{font-family:var(--body);font-size:13px;font-weight:400;color:var(--muted)}
.rules{margin:0 0 26px;padding:0;list-style:none;display:grid;gap:11px}
.rules li{display:flex;gap:12px;align-items:flex-start;font-size:14.6px;color:var(--ink-2);line-height:1.55}
.rules li::before{content:"";flex:none;width:7px;height:7px;border-radius:50%;background:var(--signal);margin-top:8px}
.agree{
  display:flex;gap:13px;align-items:flex-start;padding:16px 18px;border-radius:var(--r-sm);
  background:var(--signal-soft);border:1.5px solid #CFE6AE;cursor:pointer;margin-bottom:20px;
}
.agree input{margin:1px 0 0;flex:none;width:19px;height:19px;accent-color:var(--signal-d)}
.agree span{font-size:14.5px;line-height:1.5}

/* toast */
.toast-host{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);z-index:200;display:flex;flex-direction:column;gap:9px;align-items:center}
.toast{
  background:var(--ink);color:#fff;padding:12px 20px;border-radius:999px;font-size:14px;font-weight:500;
  box-shadow:var(--shadow-lg);animation:pop .3s cubic-bezier(.16,1,.3,1);max-width:92vw;
}
.toast.bad{background:var(--danger)}
@keyframes pop{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}

/* modal */
.modal-host{position:fixed;inset:0;z-index:150;background:rgba(12,29,47,.55);display:grid;place-items:center;padding:20px;backdrop-filter:blur(3px)}
.modal{background:var(--card);border-radius:18px;padding:30px;width:min(460px,94vw);box-shadow:var(--shadow-lg)}
.modal h3{font-family:var(--display);margin:0 0 10px;font-size:21px}
.modal p{color:var(--muted);margin:0 0 22px;font-size:15px}
.modal .row{display:flex;gap:10px;justify-content:flex-end;flex-wrap:wrap}

/* reveal on scroll */
.reveal{opacity:0;transform:translateY(26px)}
.reveal.in{opacity:1;transform:none;transition:opacity .7s cubic-bezier(.16,1,.3,1), transform .7s cubic-bezier(.16,1,.3,1)}

/* ---------- responsive ---------- */
@media (max-width:980px){
  .steps{grid-template-columns:1fr 1fr}
  .test-grid{grid-template-columns:1fr}
  .test-side{position:static;order:-1}
  .palette{grid-template-columns:repeat(10,1fr)}
}
@media (max-width:760px){
  .navlinks{
    display:none;position:absolute;top:100%;left:0;right:0;background:#fff;flex-direction:column;
    align-items:stretch;gap:0;padding:10px 5vw 18px;box-shadow:0 18px 30px -22px rgba(12,29,47,.5);
  }
  .navlinks.open{display:flex}
  .navlinks a{padding:12px 0;border-bottom:1px solid var(--line);color:var(--ink) !important;opacity:1}
  .navlinks a.admin-link{border:none;padding:12px 0;font-family:var(--body);font-size:14.5px;letter-spacing:0;text-transform:none}
  .navlinks .only-mobile{display:block;font-weight:650;color:var(--signal-d) !important;border-bottom:none}
  .menu-btn{display:block}
  .topbar .row > .btn.primary{display:none}
  .topbar.over-dark:not(.solid) .menu-btn{border-color:rgba(255,255,255,.5);color:#fff}
  .form-grid{grid-template-columns:1fr}
  .steps{grid-template-columns:1fr}
  .panel{padding:26px 20px}
  .section{padding:70px 0}
  .cta-band{padding:40px 22px}
  .hero-inner{padding:120px 0 108px}
  .ffoi-corner{bottom:12px;right:5vw;gap:8px}
  .ffoi-corner img{height:34px}
  .ffoi-corner span{display:none}
  .palette{grid-template-columns:repeat(5,1fr)}
  .bd-row{grid-template-columns:100px 1fr 48px}

}
@media (prefers-reduced-motion:reduce){
  *{animation-duration:.001ms !important;animation-iteration-count:1 !important;transition-duration:.001ms !important}
  html{scroll-behavior:auto}
  .wall{overflow-x:auto}
  .wall-track{animation:none}
  .reveal{opacity:1;transform:none}
}

</style>

/* =========================================================================
   Storage — persists through window.storage when available,
   falls back to an in-memory store so the page still works offline.
   ========================================================================= */
const MEM = {};
const KEY_APPS = "pf:applicants", KEY_SITE = "pf:site", KEY_ME = "pf:me";
/* Storage is best-effort: if the host is slow or unavailable we fall back to
   memory rather than leaving a button stuck on "Saving…". */
const withTimeout = (promise, ms = 4000) =>
  Promise.race([promise, new Promise((_, rej)=> setTimeout(()=> rej(new Error("storage timeout")), ms))]);
/* When the page runs as a plain file in a browser there is no window.storage,
   so fall back to localStorage — otherwise an admin's uploaded paper and every
   registration would disappear on refresh. Memory is the last resort. */
const Local = {
  get(key){
    try{ const v = localStorage.getItem(key); return v === null ? null : JSON.parse(v); }
    catch(e){ return null; }
  },
  set(key, val){
    try{ localStorage.setItem(key, JSON.stringify(val)); return true; }
    catch(e){ return false; }
  }
};
const Store = {
  async get(key, shared = true){
    if (window.storage){
      try{ const r = await withTimeout(window.storage.get(key, shared)); return r ? JSON.parse(r.value) : null; }
      catch(e){ /* fall through to the local copy */ }
    }
    const local = Local.get(key);
    return local !== null ? local : (MEM[key] ?? null);
  },
  async set(key, val, shared = true){
    MEM[key] = val;
    Local.set(key, val);
    if (window.storage){
      try{ await withTimeout(window.storage.set(key, JSON.stringify(val), shared)); return true; }
      catch(e){ return false; }
    }
    return true;
  }
};

const DB = {
  /* ---- public ---- */
  async boot(){
    if(!ONLINE){
      const [apps, site, me] = await Promise.all([Store.get(KEY_APPS), Store.get(KEY_SITE), Store.get(KEY_ME, false)]);
      if(Array.isArray(apps)) state.apps = apps;
      if(site && typeof site === "object") state.site = {...DEFAULT_SITE, ...site};
      if(me) state.me = me;
      return;
    }
    const [{data:st}, {data:pp}, {data:sess}] = await Promise.all([
      sb.rpc("get_settings"), sb.rpc("get_paper"), sb.auth.getSession()
    ]);
    if(st) state.site = {...DEFAULT_SITE, ...siteFromRow(st)};
    state.site.questions = (pp && pp.length) ? pp : null;   // arrives without answers
    state.admin = !!(sess && sess.session);
    state.me = await Store.get(KEY_ME, false);
  },
  async saveSite(){
    if(!ONLINE) return Store.set(KEY_SITE, state.site);
    const {error} = await sb.from("settings").upsert(siteToRow(state.site));
    if(error) throw error;
    return true;
  },
  async register(d){
    if(!ONLINE){
      const rec = {id:newId(), ...d, agreedAt:Date.now(), registeredAt:Date.now(), status:"registered",
        score:null, total:paper().length, percent:null, answers:null, submittedAt:null,
        released:false, releasedAt:null};
      state.apps.push(rec); Store.set(KEY_APPS, state.apps);
      return {id:rec.id, existing:false, status:"registered"};
    }
    const {data, error} = await sb.rpc("register_applicant", {p:d});
    if(error) throw error;
    return data;
  },
  async submit(id, answers, auto){
    if(!ONLINE){
      const me = state.apps.find(a=>a.id === id);
      let score = 0, total = 0;
      answers.forEach((v,k)=>{ const mk = paper()[k].m || 1; total += mk; if(v === paper()[k].a) score += mk; });
      Object.assign(me, {answers, key:paper().map(q=>({s:q.s, a:q.a})), score,
        total, percent:Math.round(score/total*100),
        marks:answers.map((v,k)=> v === paper()[k].a),
        status:"submitted", submittedAt:Date.now(), autoSubmitted:!!auto});
      await Store.set(KEY_APPS, state.apps);
      return {ok:true};
    }
    const {data, error} = await sb.rpc("submit_test", {p_id:id, p_answers:answers, p_auto:!!auto});
    if(error) throw error;
    return data;
  },
  async logTabSwitch(id){
    if(!ONLINE) return;
    try{ await sb.rpc("log_tab_switch", {p_id:id}); }
    catch(err){ console.error(err); }
  },
  async status(id, email){
    if(!ONLINE){
      return state.apps.find(a=>a.id.toUpperCase() === id.toUpperCase()
                             && a.email.toLowerCase() === email.toLowerCase()) || null;
    }
    const {data, error} = await sb.rpc("get_status", {p_id:id, p_email:email});
    if(error) throw error;
    if(!data) return null;
    return {...data,
      registeredAt:data.registeredAt ? Date.parse(data.registeredAt) : null,
      submittedAt:data.submittedAt ? Date.parse(data.submittedAt) : null,
      releasedAt:data.releasedAt ? Date.parse(data.releasedAt) : null};
  },

  /* ---- admin ---- */
  async signIn(email, password){
    if(!ONLINE) return String(password).trim() === String(state.site.adminPass).trim();
    const {error} = await sb.auth.signInWithPassword({email:email.trim(), password});
    if(error) throw error;
    return true;
  },
  async signOut(){ if(ONLINE) await sb.auth.signOut(); },
  async loadAdmin(){
    if(!ONLINE) return;
    const [{data:rows, error:e1}, {data:qs, error:e2}] = await Promise.all([
      sb.from("applicants").select("*").order("registered_at", {ascending:false}),
      sb.from("questions").select("*").order("ord").order("id")
    ]);
    if(e1) throw e1;
    if(e2) throw e2;
    state.apps = (rows || []).map(fromRow);
    state.adminPaper = (qs || []).map(q=>({s:q.section, q:q.prompt, o:q.options, a:q.answer, m:q.marks || 1}));
  },
  async patchApplicant(id, patch){
    if(!ONLINE) return Store.set(KEY_APPS, state.apps);
    const {error} = await sb.from("applicants").update(patch).eq("id", id);
    if(error) throw error;
    return true;
  },
  async removeApplicant(id){
    if(!ONLINE){ state.apps = state.apps.filter(a=>a.id !== id); return Store.set(KEY_APPS, state.apps); }
    const {error} = await sb.from("applicants").delete().eq("id", id);
    if(error) throw error;
    state.apps = state.apps.filter(a=>a.id !== id);
    return true;
  },
  async saveQuestions(list){
    if(!ONLINE){ state.site.questions = list; return Store.set(KEY_SITE, state.site); }
    const del = await sb.from("questions").delete().gte("id", 0);
    if(del.error) throw del.error;
    if(list.length){
      const rows = list.map((q,i)=>({ord:i, section:q.s, prompt:q.q, options:q.o, answer:q.a, marks:q.m || 1}));
      const ins = await sb.from("questions").insert(rows);
      if(ins.error) throw ins.error;
    }
    state.adminPaper = list.slice();
    state.site.questions = list.map(q=>({s:q.s, q:q.q, o:q.o}));
    return true;
  }
};

function toast(msg, bad){
  let host = $(".toast-host");
  if(!host){ host = document.createElement("div"); host.className = "toast-host"; document.body.appendChild(host); }
  const t = document.createElement("div");
  t.className = "toast" + (bad ? " bad" : "");
  t.textContent = msg;
  host.appendChild(t);
  setTimeout(()=>{ t.style.opacity = "0"; t.style.transition = "opacity .3s"; setTimeout(()=>t.remove(), 320); }, 2600);
}

function confirmBox({title, body, ok="Confirm", danger=false}){
  return new Promise(res=>{
    const host = document.createElement("div");
    host.className = "modal-host";
    host.innerHTML = `<div class="modal" role="dialog" aria-modal="true">
      <h3>${esc(title)}</h3><p>${body}</p>
      <div class="row"><button class="btn ghost sm" data-x="no">Cancel</button>
      <button class="btn sm" data-x="yes" style="${danger?"background:var(--danger)":""}">${esc(ok)}</button></div></div>`;
    host.addEventListener("click", e=>{
      const v = e.target.dataset.x;
      if(v || e.target === host){ host.remove(); res(v === "yes"); }
    });
    document.body.appendChild(host);
    host.querySelector('[data-x="yes"]').focus();
  });
}

const ROUTES = {"":renderHome, "test":renderTest, "status":renderStatus, "admin":renderAdmin};

function currentPath(){
  try{ return (location.hash || "#/").replace(/^#\/?/, "").split("?")[0]; }
  catch(e){ return ""; }
}
function route(path){
  const p = path === undefined ? currentPath() : path;
  if(p === "register"){                    // a popup over whatever is on screen
    if(!app().innerHTML.trim()) renderHome();
    return openRegister();
  }
  closeSheet();
  (ROUTES[p] || renderHome)();
  window.scrollTo({top:0, behavior:"instant"});
}
/* Navigate directly rather than waiting on a hashchange — some embedded
   viewers block fragment navigation, and the app has to work there too. */
function go(path){
  try{ history.replaceState(null, "", "#/" + path); }catch(e){}
  route(path);
}
document.addEventListener("click", e=>{
  const a = e.target.closest && e.target.closest('a[href^="#/"]');
  if(!a) return;
  e.preventDefault();
  go(a.getAttribute("href").replace(/^#\//, ""));
});
document.addEventListener("keydown", e=>{ if(e.key === "Escape") closeSheet(); });

  const onScroll = ()=>{
    const bar = $("#topbar"), lg = $("#navlogo");

/* =========================================================================
   REGISTER
   ========================================================================= */
const STREAMS = ["B.Com / M.Com","BBA / BMS / BBI / BAF","BFM / Finance","Economics","Engineering","Science","Arts / Humanities","CA / CS / CMA (any level)","MBA / PGDM","Other"];

function closeSheet(){
  const s = $(".sheet-host");
  if(s){ s.remove(); document.body.style.overflow = ""; }
}

const YEARS = ["1st year","2nd year","3rd year","4th year"];
let regDraft = null;          // survives a hop back from step 2 to step 1

function openRegister(){
  if($(".sheet-host")) return;
  const host = document.createElement("div");
  host.className = "sheet-host";
  host.innerHTML = `<div class="sheet" role="dialog" aria-modal="true" aria-label="Registration">
    <div class="panel" id="sheetPanel"></div></div>`;
  document.body.appendChild(host);
  document.body.style.overflow = "hidden";
  host.addEventListener("click", e=>{ if(e.target === host) closeSheet(); });
  stepRegister();
}

/* ---------- step 1: who you are ---------- */
function stepRegister(){
  const d = regDraft || {};
  $("#sheetPanel").innerHTML = `
    <button class="sheet-close" id="sheetClose" aria-label="Close">✕</button>
    <p class="eyebrow">Step 1 of 2 — Registration</p>
    <h1>Tell us who you are</h1>
    <p class="sub">Five details and you're done. Fields marked <span style="color:var(--danger)">*</span> are required.</p>
    <div id="regForm">
      <div class="form-grid">
        <div class="field full" data-f="fullName">
          <label for="fullName">Full name <span class="req">*</span></label>
          <input id="fullName" autocomplete="name" value="${esc(d.fullName||"")}" placeholder="As it appears on your marksheet">
          <span class="err"></span>
        </div>
        <div class="field full" data-f="email">
          <label for="email">Email ID <span class="req">*</span></label>
          <input id="email" type="email" autocomplete="email" value="${esc(d.email||"")}" placeholder="you@example.com">
          <span class="hint">Your result and interview details go to this address.</span>
          <span class="err"></span>
        </div>
        <div class="field full" data-f="college">
          <label for="college">College name <span class="req">*</span></label>
          <input id="college" value="${esc(d.college||"")}" placeholder="e.g. R. A. Podar College of Commerce &amp; Economics">
          <span class="err"></span>
        </div>
        <div class="field" data-f="stream">
          <label for="stream">Stream <span class="req">*</span></label>
          <select id="stream"><option value="">Select your stream</option>
            ${STREAMS.map(x=>`<option ${d.stream===x?"selected":""}>${x}</option>`).join("")}</select>
          <span class="err"></span>
        </div>
        <div class="field" data-f="year">
          <label for="year">Year <span class="req">*</span></label>
          <select id="year"><option value="">Select your year</option>
            ${YEARS.map(x=>`<option ${d.year===x?"selected":""}>${x}</option>`).join("")}</select>
          <span class="err"></span>
        </div>
      </div>
      <button class="btn primary wide" type="button" id="regBtn" style="margin-top:26px">Continue to test details →</button>
      <p style="text-align:center;margin:18px 0 0;color:var(--muted);font-size:14px">
        Already registered? <a href="#/status" style="color:var(--signal-d);font-weight:600">Check your result</a></p>
    </div>`;

  $("#sheetClose").onclick = closeSheet;
  $("#regBtn").onclick = onRegister;
  $$("#regForm input, #regForm select").forEach(i=>{
    i.addEventListener("input", ()=>{
      const f = i.closest(".field"); f.classList.remove("bad"); $(".err", f).textContent = "";
    });
    i.addEventListener("keydown", ev=>{ if(ev.key === "Enter"){ ev.preventDefault(); onRegister(); } });
  });
  setTimeout(()=> $("#fullName").focus(), 60);
}

function setErr(name, msg){
  const f = $(`[data-f="${name}"]`);
  if(!f) return;
  f.classList.add("bad"); $(".err", f).textContent = msg;
}

function onRegister(e){
  if(e && e.preventDefault) e.preventDefault();
  const d = {};
  ["fullName","email","college","stream","year"]
    .forEach(k=> d[k] = String(($("#" + k) || {}).value ?? "").trim());
  $$(".field").forEach(f=>{ f.classList.remove("bad"); $(".err", f).textContent = ""; });
  const banner = $("#regAlert"); if(banner) banner.remove();

  const missing = [];
  if(d.fullName.length < 3){ setErr("fullName","Enter your full name."); missing.push("full name"); }
  if(!/^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(d.email)){ setErr("email","Enter a valid email address."); missing.push("email ID"); }
  if(d.college.length < 3){ setErr("college","Enter your college name."); missing.push("college name"); }
  if(!d.stream){ setErr("stream","Select your stream."); missing.push("stream"); }
  if(!d.year){ setErr("year","Select your year."); missing.push("year"); }

  if(missing.length){
    const first = $(".field.bad");
    const alert = document.createElement("div");
    alert.className = "note warn"; alert.id = "regAlert"; alert.style.margin = "0 0 20px";
    alert.innerHTML = `<span>!</span><span>Check your <b>${missing.join("</b>, <b>")}</b> — the fields in red need fixing.</span>`;
    $("#regForm").prepend(alert);
    if(first){
      first.scrollIntoView({behavior:"smooth", block:"center"});
      $("input, select", first)?.focus({preventScroll:true});
    }
    return;
  }

  if(!ONLINE){
    const dup = state.apps.find(a=>(a.email||"").toLowerCase() === d.email.toLowerCase());
    if(dup){
      state.me = dup.id;
      Store.set(KEY_ME, dup.id, false);
      closeSheet();
      if(dup.status === "submitted"){ toast("You've already taken the test — showing your status."); go("status"); }
      else { toast("You're already registered. Continuing to the test."); go("test"); }
      return;
    }
  }

  regDraft = d;
  stepDetails();
}

/* ---------- step 2: what the test looks like ---------- */
function stepDetails(){
  const st = state.site;
  const secs = sections();
  const rules = (st.instructions && st.instructions.length) ? st.instructions : DEFAULT_SITE.instructions;
  const panel = $("#sheetPanel");
  panel.innerHTML = `
    <button class="sheet-close" id="sheetClose" aria-label="Close">✕</button>
    <p class="eyebrow">Step 2 of 2 — Test details</p>
    <h1>Before you begin</h1>
    <p class="sub">Registering as <b>${esc(regDraft.fullName)}</b>. Here's exactly what the assessment involves.</p>

    <div class="detail-grid">
      <div><span class="k">Duration</span><span class="v">${st.durationMin} <small>minutes</small></span></div>
      <div><span class="k">Questions</span><span class="v">${paper().length}</span></div>
      <div><span class="k">Sections</span><span class="v">${secs.length}</span></div>
      <div><span class="k">Attempts</span><span class="v">1</span></div>
      <div><span class="k">Shortlist cut-off</span><span class="v">${st.passMark}<small>%</small></span></div>
    </div>

    <p style="font-family:var(--mono);font-size:11px;letter-spacing:.11em;text-transform:uppercase;color:var(--muted);margin:0 0 10px">
      Sections covered</p>
    <div style="display:flex;flex-wrap:wrap;gap:8px;margin-bottom:26px">
      ${secs.map(x=>`<span class="tag">${esc(x)}</span>`).join("")}</div>

    <p style="font-family:var(--mono);font-size:11px;letter-spacing:.11em;text-transform:uppercase;color:var(--muted);margin:0 0 12px">
      Please read</p>
    <ul class="rules">${rules.map(r=>`<li><span>${esc(r)}</span></li>`).join("")}</ul>

    <label class="agree" for="agree">
      <input type="checkbox" id="agree">
      <span>I hereby agree to the instructions above and confirm the details I have entered are correct.</span>
    </label>

    <button class="btn primary wide" type="button" id="beginBtn" disabled>Submit and begin the test →</button>
    <button class="btn ghost wide sm" type="button" id="backBtn" style="margin-top:10px">← Back to my details</button>`;

  $("#sheetClose").onclick = closeSheet;
  $("#backBtn").onclick = stepRegister;
  $("#agree").onchange = e=>{ $("#beginBtn").disabled = !e.target.checked; };
  $("#beginBtn").onclick = beginTest;
  panel.scrollIntoView({behavior:"smooth", block:"start"});
}

async function beginTest(){
  const btn = $("#beginBtn");
  try{
    if(!$("#agree").checked) return toast("Tick the agreement box to begin.", true);
    btn.disabled = true; btn.textContent = "Starting…";

    const res = await DB.register(regDraft);
    state.me = res.id;
    state.testName = regDraft.fullName;
    Store.set(KEY_ME, res.id, false);
    Store.set("pf:myemail", regDraft.email, false);
    regDraft = null;
    closeSheet();

    if(res.existing){
      if(res.status === "submitted"){ toast("You've already taken the test — showing your status."); return go("status"); }
      toast("You're already registered. Continuing to the test.");
    } else {
      toast("Registered. Your ID is " + res.id);
    }
    go("test");
  }catch(err){
    console.error(err);
    if(btn){ btn.disabled = false; btn.textContent = "Submit and begin the test →"; }
    toast("Couldn't start the test — check your connection and try again.", true);
  }
}

function newId(){
  const y = String(new Date().getFullYear()).slice(-2);
  const n = String(state.apps.length + 1).padStart(3,"0");
  const r = Math.random().toString(36).slice(2,5).toUpperCase();
  return `PFX-${y}-${n}${r}`;
}

/* =========================================================================
   TEST
   ========================================================================= */
function renderTest(){
  const me = ONLINE
    ? {id:state.me, fullName:(regDraft && regDraft.fullName) || state.testName || "Candidate", status:"registered"}
    : state.apps.find(a=>a.id === state.me);
  if(!state.me || !me){ toast("Register first to take the test.", true); go("register"); return; }
  if(me.status === "submitted"){ go("status"); return; }

  if(!state.test) state.test = {i:0, order:shuffledIndices(paper().length), picks:Array(paper().length).fill(null), left:state.site.durationMin*60, t:null};
  const T = state.test;

  app().innerHTML = `
  <div class="test-bar"><div class="wrap row">
    <img src="${ASSETS.logoWhite}" alt="Placeflix">
    <span class="who">${esc(me.fullName)} · ${me.id}</span>
    <span class="timer" id="timer">--:--</span>
  </div></div>
  <main class="page"><div class="wrap">
    <div class="test-grid">
      <div id="qhost"></div>
      <aside class="test-side">
        <p class="eyebrow" style="margin-bottom:6px">Question palette</p>
        <div class="palette" id="palette"></div>
        <div class="legend">
          <span><i class="d"></i>Answered</span>
          <span><i></i>Not answered</span>
        </div>
        <button class="btn primary wide sm" id="submitBtn">Submit test</button>
        <p style="font-size:12.5px;color:var(--muted);margin:12px 0 0">Your paper is auto-submitted when the timer runs out.</p>
      </aside>
    </div>
  </div></main>`;

  paintQ(); paintPalette();
  $("#submitBtn").onclick = ()=> askSubmit(false);

  if(!T.watcherOn){
    T.watcherOn = true;
    let lastFlag = 0;
    const flag = ()=>{
      const now = Date.now();
      if(now - lastFlag < 800) return; // avoid double-count when blur+visibilitychange fire together
      lastFlag = now;
      T.tabSwitches = (T.tabSwitches || 0) + 1;
      DB.logTabSwitch(state.me);
      if(T.tabSwitches >= 3){
        toast("Test auto-submitted — you left the tab too many times.", true);
        if(T.cleanup) T.cleanup();
        submitTest(true);
      } else {
        toast(`Warning ${T.tabSwitches} of 2 — leave the tab once more and your test auto-submits.`, true);
      }
    };
    const onVis  = ()=>{ if(document.hidden) flag(); };
    const onBlur = ()=> flag();
    document.addEventListener("visibilitychange", onVis);
    window.addEventListener("blur", onBlur);
    T.cleanup = ()=>{
      document.removeEventListener("visibilitychange", onVis);
      window.removeEventListener("blur", onBlur);
    };
  }

  clearInterval(T.t);
  const tick = ()=>{
    T.left--;
    const el = $("#timer"); if(!el){ clearInterval(T.t); return; }
    const m = Math.floor(T.left/60), s = T.left%60;
    el.textContent = `${String(m).padStart(2,"0")}:${String(s).padStart(2,"0")}`;
    el.classList.toggle("low", T.left <= 120);
    if(T.left <= 0){ clearInterval(T.t); submitTest(true); }
  };
  tick(); T.t = setInterval(tick, 1000);
}

function shuffledIndices(n){
  const arr = Array.from({length:n}, (_,i)=>i);
  for(let i = arr.length - 1; i > 0; i--){
    const j = Math.floor(Math.random() * (i + 1));
    [arr[i], arr[j]] = [arr[j], arr[i]];
  }
  return arr;
}

function paintQ(){
  const T = state.test, q = paper()[T.order[T.i]];
  $("#qhost").innerHTML = `
    <div class="qcard" oncontextmenu="return false" onselectstart="return false" style="user-select:none;-webkit-user-select:none">
      <div class="qmeta">
        <span class="tag">${q.s}</span>
        <span class="tag grey">Question ${T.i+1} of ${paper().length}</span>
        <span class="tag grey">${q.m||1} mark${(q.m||1)>1?"s":""}</span>
      </div>
      <p class="qtext">${esc(q.q)}</p>
      <div class="opts">
        ${q.o.map((o,k)=>`
          <label class="opt${T.picks[T.order[T.i]]===k?" sel":""}">
            <input type="radio" name="opt" value="${k}" ${T.picks[T.order[T.i]]===k?"checked":""}>
            <span class="k">${LETTER(k)}</span><span>${esc(o)}</span>
          </label>`).join("")}
      </div>
      <div class="nav-row">
        <button class="btn ghost sm" id="prevBtn" ${T.i===0?"disabled":""}>← Previous</button>
        <button class="btn sm" id="nextBtn" ${T.i===paper().length-1?"disabled":""}>Next →</button>
        <button class="btn ghost sm" id="clearBtn" style="margin-left:auto">Clear answer</button>
      </div>
    </div>`;
  $$("#qhost input[name=opt]").forEach(r=> r.onchange = ()=>{
    state.test.picks[state.test.order[state.test.i]] = +r.value;
    paintQ(); paintPalette();
    if(state.test.i < paper().length-1) setTimeout(()=>{ state.test.i++; paintQ(); paintPalette(); }, 190);
  });
  $("#prevBtn").onclick = ()=>{ if(T.i>0){ T.i--; paintQ(); paintPalette(); } };
  $("#nextBtn").onclick = ()=>{ if(T.i<paper().length-1){ T.i++; paintQ(); paintPalette(); } };
  $("#clearBtn").onclick = ()=>{ T.picks[T.order[T.i]] = null; paintQ(); paintPalette(); };
}

function paintPalette(){
  const T = state.test;
  $("#palette").innerHTML = T.order.map((canonIdx,k)=>
    `<button class="pal${T.picks[canonIdx]!==null?" done":""}${k===T.i?" now":""}" data-k="${k}">${k+1}</button>`).join("");
  $$("#palette .pal").forEach(b=> b.onclick = ()=>{ state.test.i = +b.dataset.k; paintQ(); paintPalette(); });
}

async function askSubmit(auto){
  const left = state.test.picks.filter(p=>p===null).length;
  const ok = await confirmBox({
    title:"Submit your test?",
    body: left ? `<b>${left}</b> question${left>1?"s are":" is"} still unanswered. You can't reopen the paper after submitting.`
               : "All questions answered. You can't reopen the paper after submitting.",
    ok:"Submit test"
  });
  if(ok) submitTest(auto);
}

async function submitTest(auto){
  clearInterval(state.test.t);
  if(state.test.cleanup) state.test.cleanup();
  const picks = state.test.picks;
  try{
    await DB.submit(state.me, picks, auto);
  }catch(err){
    console.error(err);
    toast("Your paper couldn't be sent. Check your connection — the timer has stopped.", true);
    return;
  }
  state.test = null;
  toast(auto ? "Time up — your paper was submitted." : "Test submitted.");
  go("status");
}

/* =========================================================================
   STATUS / RESULT
   ========================================================================= */
async function renderStatus(){
  app().innerHTML = `${appBar()}<main class="page"><div class="wrap" style="max-width:820px" id="statusHost"></div></main>`;
  if(!state.me) return paintLookup();
  if(!ONLINE){
    const me = state.apps.find(a=>a.id === state.me);
    return me ? paintStatus(me) : paintLookup();
  }
  $("#statusHost").innerHTML = `<div class="panel"><p class="sub" style="margin:0">Loading your application…</p></div>`;
  try{
    const em = await Store.get("pf:myemail", false);
    const me = em ? await DB.status(state.me, em) : null;
    if(me) paintStatus(me); else paintLookup();
  }catch(err){ console.error(err); paintLookup("Couldn't reach the result desk just now. Try again in a moment."); }
}

function paintLookup(msg){
  $("#statusHost").innerHTML = `
    <div class="panel">
      <p class="eyebrow">Result desk</p>
      <h1>Check your result</h1>
      <p class="sub">Enter the application ID you got after registering, plus the email you used.</p>
      ${msg ? `<div class="note warn" style="margin-bottom:20px"><span>!</span><span>${esc(msg)}</span></div>` : ""}
      <div id="lookForm">
        <div class="form-grid">
          <div class="field"><label for="lid">Application ID</label>
            <input id="lid" placeholder="PFX-26-001ABC" style="text-transform:uppercase"></div>
          <div class="field"><label for="lem">Email</label>
            <input id="lem" type="email" placeholder="you@example.com"></div>
        </div>
        <button class="btn primary wide" type="button" id="lookBtn" style="margin-top:22px">Show my status</button>
      </div>
      <p style="text-align:center;margin:20px 0 0;color:var(--muted);font-size:14px">
        Not registered yet? <a href="#/register" style="color:var(--signal-d);font-weight:600">Register here</a></p>
    </div>`;
  const lookup = async ()=>{
    const id = $("#lid").value.trim().toUpperCase(), em = $("#lem").value.trim().toLowerCase();
    if(!id || !em) return paintLookup("Enter both your application ID and your email.");
    let rec = null;
    try{ rec = await DB.status(id, em); }
    catch(err){ console.error(err); return paintLookup("Couldn't reach the result desk. Try again in a moment."); }
    if(!rec) return paintLookup("No application matches that ID and email. Check both and try again.");
    state.me = rec.id;
    Store.set(KEY_ME, rec.id, false);
    Store.set("pf:myemail", em, false);
    paintStatus(rec);
  };
  $("#lookBtn").onclick = lookup;
  $$("#lookForm input").forEach(i=> i.addEventListener("keydown", e=>{ if(e.key === "Enter"){ e.preventDefault(); lookup(); } }));
}

function paintStatus(me){
  const host = $("#statusHost");
  const idLine = `<div class="note info" style="margin-bottom:26px"><span>#</span><span>
      <b>${esc(me.fullName)}</b> · Application ID <b>${me.id}</b> · ${esc(me.email)}</span></div>`;

  if(me.status !== "submitted"){
    host.innerHTML = `<div class="panel">${idLine}
      <p class="eyebrow">Status</p><h1>Your test is still pending</h1>
      <p class="sub">You're registered but haven't taken the assessment yet.</p>
      <a class="btn primary" href="#/test">Take the test now</a>
      <button class="btn ghost" id="signout" style="margin-left:10px">Not you?</button></div>`;
    $("#signout").onclick = signOutStudent;
    return;
  }

  if(!me.released){
    host.innerHTML = `<div class="panel">${idLine}
      <p class="eyebrow">Status</p><h1>Submitted — with the review team</h1>
      <p class="sub">Your paper reached us on ${fmt(me.submittedAt)}. Scores are released by the Placeflix team, so your result stays locked until then.</p>
      <div class="note warn"><span>⏳</span><span><b>Result not released yet.</b> Check back here — nothing else is needed from you. If it's been more than 48 hours, write to results@placeflix.in with your application ID.</span></div>
      <div style="margin-top:26px;display:flex;gap:10px;flex-wrap:wrap">
        <a class="btn ghost" href="#/">Back to home</a>
        <button class="btn ghost" id="signout">Not you?</button>
      </div></div>`;
    $("#signout").onclick = signOutStudent;
    return;
  }

  const pass = me.percent >= state.site.passMark;
  let per;
  if(me.breakdown && me.breakdown.length){
    per = me.breakdown.map(b=>({sec:b.sec, got:b.got, of:b.of, pc:Math.round(b.got/b.of*100)}));
  } else {
    const key = me.key || paper().map(q=>({s:q.s, a:q.a}));
    per = [...new Set(key.map(k=>k.s))].map(sec=>{
      const idx = key.map((q,i)=>({q,i})).filter(x=>x.q.s === sec);
      const got = idx.filter(x=> me.answers[x.i] === x.q.a).length;
      return {sec, got, of:idx.length, pc: Math.round(got/idx.length*100)};
    });
  }

let adminLiveChannel = null;
function watchAdminLive(){
  if(!ONLINE || adminLiveChannel) return;
  adminLiveChannel = sb.channel("admin-live")
    .on("postgres_changes", {event:"INSERT", schema:"public", table:"applicants"}, payload=>{
      const row = fromRow(payload.new);
      if(!state.apps.some(a=>a.id === row.id)) state.apps.unshift(row);
      toast(`${row.fullName} just registered.`);
      pushAlert(`${row.fullName} registered.`);
      if(state.admin && state.adminTab === "applicants") tabApplicants();
    })
    .on("postgres_changes", {event:"UPDATE", schema:"public", table:"applicants"}, payload=>{
      const before = payload.old || {}, row = fromRow(payload.new);
      const i = state.apps.findIndex(a=>a.id === row.id);
      if(i > -1) state.apps[i] = row; else state.apps.unshift(row);

      if(before.status !== "submitted" && payload.new.status === "submitted"){
        toast(`${row.fullName} submitted — scored ${row.score}/${row.total} (${row.percent}%).`);
        pushAlert(`${row.fullName} submitted — scored ${row.score}/${row.total} (${row.percent}%).`);
      } else if((row.tabSwitches || 0) > (before.tab_switches || 0)){
        toast(`⚠ ${row.fullName} left the test tab (${row.tabSwitches}×).`, true);
        pushAlert(`${row.fullName} left the test tab (${row.tabSwitches}× so far).`, true);
      }
      if(state.admin && state.adminTab === "applicants") tabApplicants();
    })
    .subscribe();
}

async function act(kind, id){
  const a = state.apps.find(x=>x.id === id);
  if(!a) return;
  if(kind === "open"){ state.open = state.open === id ? null : id; return tabApplicants(); }
  try{
    if(kind === "release"){
      a.released = true; a.releasedAt = Date.now();
      await DB.patchApplicant(id, {released:true, released_at:new Date().toISOString()});
      toast(`Result released to ${a.fullName}.`);
    }
    if(kind === "hold"){
      a.released = false; a.releasedAt = null;
      await DB.patchApplicant(id, {released:false, released_at:null});
      toast(`Result held back from ${a.fullName}.`);
    }
    if(kind === "del"){
      if(!await confirmBox({title:"Delete this applicant?", body:`Everything for <b>${esc(a.fullName)}</b> (${a.id}) is removed, including the test paper.`, ok:"Delete", danger:true})) return;
      await DB.removeApplicant(id);
      state.apps = state.apps.filter(x=>x.id !== id);
      state.open = null; toast("Applicant deleted.");
    }
  }catch(err){ console.error(err); toast("That change didn't save. Try again.", true); }
  tabApplicants();
}

/* Saving a file is best-effort: preview windows and sandboxed iframes block
   downloads silently, so every caller also offers a copy-to-clipboard route. */
function saveBlob(blob, filename){
  try{
    if(navigator.msSaveOrOpenBlob){ navigator.msSaveOrOpenBlob(blob, filename); return true; }
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url; a.download = filename; a.rel = "noopener"; a.style.display = "none";
    document.body.appendChild(a);
    a.click();
    setTimeout(()=>{ a.remove(); URL.revokeObjectURL(url); }, 4000);
    return true;
  }catch(err){ console.error(err); return false; }
}
function download(text, filename, mime){
  return saveBlob(new Blob([text], {type:mime + ";charset=utf-8"}), filename);
}
async function copyText(t){
  try{ await navigator.clipboard.writeText(t); return true; }
  catch(err){
    try{
      const ta = document.createElement("textarea");
      ta.value = t; ta.setAttribute("readonly","");
      ta.style.cssText = "position:fixed;top:0;left:0;opacity:0";
      document.body.appendChild(ta); ta.select();
      const ok = document.execCommand("copy"); ta.remove(); return ok;
    }catch(e2){ return false; }
  }
}

   QUESTION PAPER — upload from Word (.docx), or paste plain text
   ========================================================================= */

/* Reads word/document.xml straight out of the .docx zip and returns its
   paragraphs as plain strings. No libraries: the browser does the inflating. */
async function docxParagraphs(file){
  const buf = new Uint8Array(await file.arrayBuffer());
  const dv  = new DataView(buf.buffer);
  let eo = -1;
  for(let i = buf.length - 22; i >= Math.max(0, buf.length - 66000); i--){
    if(dv.getUint32(i, true) === 0x06054b50){ eo = i; break; }
  }
  if(eo < 0) throw new Error("That doesn't look like a .docx file. Save it from Word as Word Document (.docx).");

  const count = dv.getUint16(eo + 10, true);
  let p = dv.getUint32(eo + 16, true), target = null;
  const dec = new TextDecoder();
  for(let n = 0; n < count; n++){
    if(dv.getUint32(p, true) !== 0x02414b50 && dv.getUint32(p, true) !== 0x02014b50) break;
    const method = dv.getUint16(p + 10, true);
    const csize  = dv.getUint32(p + 20, true);
    const nlen   = dv.getUint16(p + 28, true);
    const elen   = dv.getUint16(p + 30, true);
    const clen   = dv.getUint16(p + 32, true);
    const lho    = dv.getUint32(p + 42, true);
    if(dec.decode(buf.subarray(p + 46, p + 46 + nlen)) === "word/document.xml") target = {method, csize, lho};
    p += 46 + nlen + elen + clen;
  }
  if(!target) throw new Error("No document text found inside that file.");

  const q = target.lho;
  if(dv.getUint32(q, true) !== 0x04034b50) throw new Error("That file looks damaged. Try re-saving it from Word.");
  const start = q + 30 + dv.getUint16(q + 26, true) + dv.getUint16(q + 28, true);
  let bytes = buf.subarray(start, target.csize ? start + target.csize : eo);
  if(target.method === 8){
    if(!window.DecompressionStream) throw new Error("This browser can't open .docx files. Paste the questions as text instead.");
    const stream = new Blob([bytes]).stream().pipeThrough(new DecompressionStream("deflate-raw"));
    bytes = new Uint8Array(await new Response(stream).arrayBuffer());
  } else if(target.method !== 0){
    throw new Error("Unsupported compression in that file. Re-save it from Word.");
  }

  const doc = new DOMParser().parseFromString(dec.decode(bytes), "application/xml");
  if(doc.getElementsByTagName("parsererror").length) throw new Error("Could not read that document.");
  return [...doc.getElementsByTagName("w:p")].map(node=>{
    let t = "";
    for(const n of node.getElementsByTagName("*")){
      if(n.tagName === "w:t") t += n.textContent;
      else if(n.tagName === "w:tab" || n.tagName === "w:br") t += " ";
    }
    return t.replace(/\s+/g, " ").trim();
  }).filter(Boolean);
}

/* Turns lines of text into questions. Tolerant of the ways people actually
   type papers: Q1. / 1) / plain, A) B) C) or (a) (b), Answer: B or Ans - 2,
   a * or (correct) marking the right option, optional Section: lines. */
function shuffleOptions(q){
  // Fisher–Yates shuffle of the options array, keeping q.a pointed at the
  // same underlying correct option after reordering. The answer text and
  // meaning never change — only where it lands in the list.
  const pairs = q.o.map((text, i)=>({text, correct: i === q.a}));
  for(let i = pairs.length - 1; i > 0; i--){
    const j = Math.floor(Math.random() * (i + 1));
    [pairs[i], pairs[j]] = [pairs[j], pairs[i]];
  }
  q.o = pairs.map(p=>p.text);
  q.a = pairs.findIndex(p=>p.correct);
  return q;
}

function parseQuestions(lines){
  const out = [], skipped = [];
  let cur = null, section = "General";
  const flush = ()=>{
    if(!cur) return;
    if(cur.o.length >= 2 && cur.a !== null && cur.a < cur.o.length){
      if(!cur.m || cur.m < 1) cur.m = 1;
      out.push(shuffleOptions(cur));
    }
    else if(cur.q) skipped.push(cur.q);
    cur = null;
  };
  for(const raw of lines){
    const line = String(raw).replace(/^[•▪◦\-–—]\s*/, "").trim();
    if(!line) continue;
    let m;

    if(m = line.match(/^(section|topic|category|subject)\s*[:\-–]\s*(.+)$/i)){ section = m[2].trim().slice(0,28); continue; }

    if(m = line.match(/^(?:marks?|points?|weight(?:age)?)\s*[:\-–=]\s*(\d+(?:\.\d+)?)\s*$/i)){
      if(cur) cur.m = Math.max(1, Math.round(+m[1]));
      continue;
    }

    if(m = line.match(/^(?:correct\s*)?(?:ans|answer|key)(?:\s*key)?\s*[:\-–=]?\s*\(?([a-zA-Z]|\d{1,2})\)?[\.\s]*$/i)){
      if(cur){
        const v = m[1].toUpperCase();
        cur.a = /^\d+$/.test(v) ? (+v - 1) : v.charCodeAt(0) - 65;
      }
      continue;
    }

    if(cur && (m = line.match(/^\(?([a-zA-Z])[\.\)\]:]\s*(.+)$/))){
      let text = m[2].trim(), right = false;
      if(/^\*+/.test(text)){ right = true; text = text.replace(/^\*+\s*/, ""); }
      if(/\*+$/.test(text)){ right = true; text = text.replace(/\s*\*+$/, ""); }
      if(/\s*[\(\[](correct|ans|answer|right)[\)\]]\s*$/i.test(text)){
        right = true; text = text.replace(/\s*[\(\[](correct|ans|answer|right)[\)\]]\s*$/i, "");
      }
      cur.o.push(text);
      if(right) cur.a = cur.o.length - 1;
      continue;
    }

    if(m = line.match(/^(?:q(?:uestion)?\s*)?(\d+)\s*[\.\):\-]\s*(.+)$/i)){
      flush(); cur = {s:section, q:m[2].trim(), o:[], a:null}; continue;
    }

    if(!cur){ cur = {s:section, q:line, o:[], a:null}; continue; }
    if(cur.o.length){ flush(); cur = {s:section, q:line, o:[], a:null}; }
    else cur.q += " " + line;
  }
  flush();
  return {out, skipped};
}

/* ---------- writes a .docx the admin can open in Word and edit ---------- */
const CRC_TABLE = (()=>{
  const t = new Uint32Array(256);
  for(let n = 0; n < 256; n++){
    let c = n;
    for(let k = 0; k < 8; k++) c = (c & 1) ? (0xEDB88320 ^ (c >>> 1)) : (c >>> 1);
    t[n] = c >>> 0;
  }
  return t;
})();
function crc32(bytes){
  let c = 0xFFFFFFFF;
  for(let i = 0; i < bytes.length; i++) c = CRC_TABLE[(c ^ bytes[i]) & 0xFF] ^ (c >>> 8);
  return (c ^ 0xFFFFFFFF) >>> 0;
}
function zipStore(files){
  const enc = new TextEncoder(), parts = [], central = [];
  let offset = 0;
  for(const f of files){
    const name = enc.encode(f.name), crc = crc32(f.data), size = f.data.length;
    const lh = new Uint8Array(30 + name.length), lv = new DataView(lh.buffer);
    lv.setUint32(0, 0x04034b50, true); lv.setUint16(4, 20, true);
    lv.setUint32(14, crc, true); lv.setUint32(18, size, true); lv.setUint32(22, size, true);
    lv.setUint16(26, name.length, true);
    lh.set(name, 30);
    parts.push(lh, f.data);

    const ch = new Uint8Array(46 + name.length), cv = new DataView(ch.buffer);
    cv.setUint32(0, 0x02014b50, true); cv.setUint16(4, 20, true); cv.setUint16(6, 20, true);
    cv.setUint32(16, crc, true); cv.setUint32(20, size, true); cv.setUint32(24, size, true);
    cv.setUint16(28, name.length, true); cv.setUint32(42, offset, true);
    ch.set(name, 46);
    central.push(ch);
    offset += lh.length + size;
  }
  const cdSize = central.reduce((n, c)=> n + c.length, 0);
  const end = new Uint8Array(22), ev = new DataView(end.buffer);
  ev.setUint32(0, 0x06054b50, true);
  ev.setUint16(8, files.length, true); ev.setUint16(10, files.length, true);
  ev.setUint32(12, cdSize, true); ev.setUint32(16, offset, true);
  return new Blob([...parts, ...central, end], {type:"application/vnd.openxmlformats-officedocument.wordprocessingml.document"});
}
function downloadTemplate(){
  const enc = new TextEncoder();
  const para = (t, bold)=>`<w:p><w:r>${bold?"<w:rPr><w:b/></w:rPr>":""}<w:t xml:space="preserve">${
    String(t).replace(/[&<>]/g, c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]))}</w:t></w:r></w:p>`;
  const body = [
    para("Placeflix — question paper", true),
    para("Keep this layout. Add as many questions as you like, then upload this file in Admin → Questions."),
    para(""),
    para("Section: Aptitude", true),
    para("Q1. A trader buys shares worth Rs 12,000 and sells them for Rs 13,800. What is the profit percentage?"),
    para("A) 12%"), para("B) 15%"), para("C) 18%"), para("D) 20%"),
    para("Answer: B"),
    para(""),
    para("Q2. If 8 analysts finish a report in 15 days, how many days will 10 analysts take?"),
    para("A) 10 days"), para("B) 12 days"), para("C) 13 days"), para("D) 18 days"),
    para("Answer: B"),
    para(""),
    para("Section: Markets", true),
    para("Q3. Which body regulates the securities market in India?"),
    para("A) RBI"), para("B) SEBI"), para("C) IRDAI"), para("D) NABARD"),
    para("Answer: B")
  ].join("");
  const doc = `<?xml version="1.0" encoding="UTF-8" standalone="yes"?>
<w:document xmlns:w="http://schemas.openxmlformats.org/wordprocessingml/2006/main"><w:body>${body}<w:sectPr/></w:body></w:document>`;
  const types = `<?xml version="1.0" encoding="UTF-8" standalone="yes"?>
<Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types"><Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/><Default Extension="xml" ContentType="application/xml"/><Override PartName="/word/document.xml" ContentType="application/vnd.openxmlformats-officedocument.wordprocessingml.document.main+xml"/></Types>`;
  const rels = `<?xml version="1.0" encoding="UTF-8" standalone="yes"?>
<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/officeDocument" Target="word/document.xml"/></Relationships>`;
  const blob = zipStore([
    {name:"[Content_Types].xml", data:enc.encode(types)},
    {name:"_rels/.rels",         data:enc.encode(rels)},
    {name:"word/document.xml",   data:enc.encode(doc)}
  ]);
  saveBlob(blob, "placeflix-question-template.docx");
  toast("Word template sent to your downloads.");
}
