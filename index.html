        : await docxParagraphs(f);
      showParsed(parseQuestions(lines), f.name);
    }catch(err){ toast(err.message || "Could not read that file.", true); }
  };
  $("#pasteBtn").onclick = ()=>{
    const text = $("#pasteIn").value.trim();
    if(!text) return toast("Paste the questions first.", true);
    showParsed(parseQuestions(text.split(/\r?\n/)), "pasted text");
  };
  $$("[data-del]").forEach(b=> b.onclick = async ()=>{
    const i = +b.dataset.del;
    const next = adminPaper().filter((_,k)=> k !== i);
    if(!next.length) return toast("A paper needs at least one question.", true);
    try{ await DB.saveQuestions(next); toast("Question removed."); tabQuestions(); }
    catch(err){ console.error(err); toast("Couldn't save that change.", true); }
  });
  if($("#resetQ")) $("#resetQ").onclick = async ()=>{
    if(!await confirmBox({title:"Go back to the built-in paper?", body:"Your uploaded questions are removed. Papers students have already submitted keep their own marking.", ok:"Use built-in paper"})) return;
    try{
      if(ONLINE) await DB.saveQuestions(QUESTIONS);
      else { state.site.questions = null; await Store.set(KEY_SITE, state.site); state.adminPaper = null; }
      toast("Back to the built-in paper."); tabQuestions();
    }catch(err){ console.error(err); toast("Couldn't reset the paper.", true); }
  };
}

function showParsed(res, source){
  const {out, skipped} = res;
  const host = $("#parsed");
  if(!out.length){
    host.innerHTML = `<div class="note warn" style="margin-bottom:22px"><span>!</span><span>
      Nothing readable in <b>${esc(source)}</b>. Check that each question has at least two lettered options and an
      <b>Answer</b> line, then try again.</span></div>`;
    return;
  }
  host.innerHTML = `
    <div class="panel" style="padding:22px;margin-bottom:24px;border-color:var(--signal);box-shadow:0 0 0 3px rgba(122,186,37,.16)">
      <p class="eyebrow" style="margin-bottom:8px">Read from ${esc(source)}</p>
      <h3 style="font-family:var(--display);margin:0 0 4px;font-size:20px">${out.length} question${out.length===1?"":"s"} ready</h3>
      ${skipped.length ? `<p style="color:var(--amber);font-size:13.5px;margin:6px 0 0">
        ${skipped.length} skipped for missing options or a missing answer: ${esc(skipped.slice(0,3).join(" · ")).slice(0,140)}…</p>` : ""}
      <div style="max-height:280px;overflow:auto;margin:16px 0;display:grid;gap:10px">
        ${out.map((q,i)=>`<div style="font-size:14px">
          <span class="tag grey">${esc(q.s)}</span> <span class="tag grey">${q.m||1} mark${(q.m||1)>1?"s":""}</span> <strong>${i+1}. ${esc(q.q)}</strong>
          <div style="display:flex;flex-wrap:wrap;gap:6px;margin-top:7px">
            ${q.o.map((o,k)=>`<span class="ans ${k===q.a?"ok":""}">${LETTER(k)}. ${esc(o)}</span>`).join("")}
          </div></div>`).join("")}
      </div>
      <div style="display:flex;gap:10px;flex-wrap:wrap">
        <button class="btn primary sm" id="replaceQ">Use these ${out.length} as the paper</button>
        <button class="btn ghost sm" id="appendQ">Add to the current paper</button>
        <button class="btn ghost sm" id="cancelQ">Cancel</button>
      </div>
    </div>`;
  $("#replaceQ").onclick = async ()=>{
    try{ await DB.saveQuestions(out); toast(`Paper replaced — ${out.length} questions are now live.`); tabQuestions(); }
    catch(err){ console.error(err); toast("Couldn't save the paper.", true); }
  };
  $("#appendQ").onclick = async ()=>{
    const merged = adminPaper().concat(out);
    try{ await DB.saveQuestions(merged); toast(`Added. The paper now has ${merged.length} questions.`); tabQuestions(); }
    catch(err){ console.error(err); toast("Couldn't save the paper.", true); }
  };
  $("#cancelQ").onclick = ()=> host.innerHTML = "";
  host.scrollIntoView({behavior:"smooth", block:"nearest"});
}

/* ---------- test settings ---------- */
function tabSettings(){
  const s = state.site;
  $("#tabHost").innerHTML = `
    <div class="panel" style="max-width:640px">
      <p class="eyebrow">Assessment</p>
      <h2 style="font-family:var(--display);margin:0 0 22px;font-size:22px">Test settings</h2>
      <div style="display:grid;gap:20px">
        <div class="field"><label for="pm">Shortlist cut-off — ${s.passMark}%</label>
          <input type="range" class="range" id="pm" min="30" max="90" step="5" value="${s.passMark}">
          <span class="hint">Students at or above this percentage are marked shortlisted when you release their result.</span></div>
        <div class="field"><label for="dm">Time limit</label>
          <select id="dm">${[10,15,20,30,45,60,90].map(v=>`<option value="${v}" ${s.durationMin===v?"selected":""}>${v} minutes</option>`).join("")}</select>
          <span class="hint">Applies to tests started after you save.</span></div>
        <div class="field"><label for="ins">Instructions shown before the test</label>
          <textarea id="ins" rows="6"
            style="width:100%;padding:11px 13px;border:1.5px solid var(--line-2);border-radius:9px;font-size:14px;font-family:var(--body);line-height:1.6"
            >${esc((s.instructions && s.instructions.length ? s.instructions : DEFAULT_SITE.instructions).join("\n"))}</textarea>
          <span class="hint">One point per line. These appear on the test-details page students see just before they agree and begin.</span></div>
        ${ONLINE ? `<div class="note info"><span>ⓘ</span><span>Admin accounts are managed in Supabase under
            <b>Authentication → Users</b>. Add a colleague there and they can sign in here.</span></div>`
          : `<div class="field"><label for="ap">Admin password</label>
          <input id="ap" value="${esc(s.adminPass)}"></div>`}
      </div>
      <div style="margin-top:24px;display:flex;gap:10px;flex-wrap:wrap">
        <button class="btn primary" id="saveSet">Save settings</button>
        ${ONLINE ? "" : `<button class="btn ghost" id="seedBtn">Add 5 sample applicants</button>`}
        <button class="btn ghost" id="wipeBtn" style="color:var(--danger);border-color:#F2CDC5">Clear all applicants</button>
      </div>
      <hr style="border:none;border-top:1px solid var(--line);margin:28px 0">
      <p class="eyebrow" style="margin-bottom:8px">Data backup</p>
      <p style="color:var(--muted);font-size:14.5px;margin:0 0 16px">
        Download every registration, test paper and page setting as a single file you can keep or move to another machine.</p>
      <div style="display:flex;gap:10px;flex-wrap:wrap">
        <button class="btn ghost" id="bkBtn">Download backup (.json)</button>
        <label class="btn ghost" style="cursor:pointer">Restore from backup
          <input type="file" id="rsBtn" accept="application/json,.json" class="hide"></label>
      </div>
      <div class="note info" style="margin-top:24px"><span>ⓘ</span><span>
        The paper currently has <b>${paper().length}</b> question${paper().length===1?"":"s"} across ${sections().join(", ")}.
        There is no cap on how many you add — do that under <b>Questions</b>.</span></div>
    </div>`;
  $("#pm").oninput = e=> $('label[for="pm"]').textContent = `Shortlist cut-off — ${e.target.value}%`;
  $("#saveSet").onclick = async ()=>{
    state.site.passMark = +$("#pm").value;
    state.site.durationMin = +$("#dm").value;
    if($("#ap")) state.site.adminPass = $("#ap").value.trim() || DEFAULT_SITE.adminPass;
    const lines = $("#ins").value.split(/\r?\n/).map(x=>x.trim()).filter(Boolean);
    state.site.instructions = lines.length ? lines : DEFAULT_SITE.instructions.slice();
    try{ await DB.saveSite(); toast("Settings saved."); }
    catch(err){ console.error(err); toast("Couldn't save those settings.", true); }
  };
  if($("#seedBtn")) $("#seedBtn").onclick = async ()=>{
    const names = [["Aarav Kulkarni","aarav.k@example.com","K. C. College","B.Com / M.Com","2nd year"],
      ["Sneha Iyer","sneha.iyer@example.com","N. M. College","BBA / BMS / BBI / BAF","3rd year"],
      ["Rohit Deshmukh","rohit.d@example.com","Sydenham College","MBA / PGDM","1st year"],
      ["Fatima Shaikh","fatima.s@example.com","Jai Hind College","Economics","4th year"],
      ["Omkar Jadhav","omkar.j@example.com","Ruia College","BFM / Finance","3rd year"]];
    names.forEach((n,i)=>{
      const score = Math.min(paper().length, [13,11,9,14,7][i]);
      state.apps.push({id:newId(), fullName:n[0], email:n[1], college:n[2], stream:n[3], year:n[4],
        agreedAt:Date.now()-(i+1)*86400000,
        registeredAt:Date.now()-(i+1)*86400000, status:"submitted", score, total:paper().length,
        percent:Math.round(score/paper().length*100),
        answers:paper().map((q,k)=> k < score ? q.a : (q.a+1)%q.o.length),
        key:paper().map(q=>({s:q.s, a:q.a})),
        submittedAt:Date.now()-(i+1)*86000000, released:i===0, releasedAt:i===0?Date.now():null});
    });
    await Store.set(KEY_APPS, state.apps);
    toast("5 sample applicants added.");
    state.adminTab = "applicants"; renderAdmin();
  };
  $("#bkBtn").onclick = ()=>{
    download(JSON.stringify({exportedAt:new Date().toISOString(), applicants:state.apps, site:state.site}, null, 2),
      `placeflix-backup-${new Date().toISOString().slice(0,10)}.json`, "application/json");
    toast("Backup downloaded.");
  };
  $("#rsBtn").onchange = e=>{
    const f = e.target.files[0]; if(!f) return;
    const rd = new FileReader();
    rd.onload = async ()=>{
      let data;
      try{ data = JSON.parse(rd.result); }catch(err){ return toast("That file isn't a Placeflix backup.", true); }
      if(!Array.isArray(data.applicants)) return toast("That file isn't a Placeflix backup.", true);
      if(!await confirmBox({title:"Restore this backup?", body:`<b>${data.applicants.length}</b> applicant record${data.applicants.length===1?"":"s"} will replace what's here now.`, ok:"Restore"})) return;
      state.apps = data.applicants;
      if(data.site) state.site = {...DEFAULT_SITE, ...data.site};
      if(ONLINE){
        toast("Settings restored. Applicant rows are not re-imported into the live database.", true);
        await DB.saveSite();
      } else {
        await Store.set(KEY_APPS, state.apps);
        await Store.set(KEY_SITE, state.site);
        toast("Backup restored.");
      }
      state.adminTab = "applicants"; renderAdmin();
    };
    rd.readAsText(f);
  };
  $("#wipeBtn").onclick = async ()=>{
    if(!await confirmBox({title:"Clear all applicants?", body:"Every registration and test paper is deleted. This can't be undone.", ok:"Delete everything", danger:true})) return;
    try{
      if(ONLINE){
        const {error} = await sb.from("applicants").delete().neq("id", "");
        if(error) throw error;
      }
      state.apps = [];
      if(!ONLINE) await Store.set(KEY_APPS, state.apps);
      toast("All applicants cleared."); state.adminTab = "applicants"; renderAdmin();
    }catch(err){ console.error(err); toast("Couldn't clear the applicants.", true); }
  };
}

/* =========================================================================
   BOOT
   ========================================================================= */
(async function boot(){
  window.addEventListener("hashchange", ()=> route());
  try{
    await DB.boot();
  }catch(e){
    console.error("Could not load saved data", e);
    toast("Couldn't reach the database — showing the built-in paper.", true);
  }
  route();
})();

</script>
</body>
